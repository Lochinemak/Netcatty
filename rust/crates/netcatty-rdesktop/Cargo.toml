[package]
name = "netcatty-rdesktop"
description = "Embedded remote desktop sessions (VNC and RDP) for Netcatty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
netcatty-core = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

# VNC (RFB) client.
vnc-rs = "0.6"

# RDP client. The individual IronRDP crates are used instead of the `ironrdp`
# meta crate: the meta crate still pins the 0.10 connector, whose `picky`
# requirement conflicts with the `curve25519-dalek` version russh needs.
ironrdp-connector = "0.12"
ironrdp-session = "0.13"
ironrdp-graphics = "0.11"
ironrdp-input = "0.9"
ironrdp-pdu = "0.11"
ironrdp-tokio = "0.12"
# The TLS backend must enable exactly one rustls crypto provider. `reqwest`
# (cloud sync) already pulls in `aws-lc-rs`; enabling `ring` here as well made
# `rustls::ClientConfig::builder()` panic in the full application build.
ironrdp-tls = { version = "0.3", features = ["rustls-aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }

[dev-dependencies]
# `start_paused` tests: the handshake timeout fires without a real wait.
tokio = { workspace = true, features = ["test-util"] }
