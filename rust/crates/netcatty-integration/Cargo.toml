[package]
name = "netcatty-integration"
description = "OS shell integration: ssh:// / telnet:// / jms:// deep links, PuTTY / SecureCRT command lines, open-terminal-at-path launches, Windows Explorer context menu, portable data mode, app icon variants, macOS Dock menu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSArray", "NSBundle", "NSObject", "NSThread"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSImage", "NSMenu", "NSMenuItem", "NSRunningApplication"] }

[dev-dependencies]
tempfile = "3"
