[package]
name = "netcatty-desktop"
description = "Netcatty desktop app (Tauri 2) — Rust backend replacing the Electron main process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "netcatty_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
netcatty-core = { workspace = true }
netcatty-ssh = { workspace = true }
netcatty-sftp = { workspace = true }
netcatty-forward = { workspace = true }
netcatty-pty = { workspace = true }
netcatty-localfs = { workspace = true }
netcatty-store = { workspace = true }
netcatty-sync = { workspace = true }
netcatty-rdesktop = { workspace = true }
netcatty-telnet = { workspace = true }
netcatty-serial = { workspace = true }
netcatty-mosh = { workspace = true }
netcatty-sysmgr = { workspace = true }
netcatty-sessionlog = { workspace = true }
netcatty-ai = { workspace = true }
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2.6"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-clipboard-manager = "2.5"
# Tray, global hotkey, autostart, notifications (commands/tray.rs, hotkey.rs, autostart.rs, notification.rs)
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-autostart = "2.7"
tauri-plugin-notification = "2.8"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
tokio-util = { workspace = true }
russh = { workspace = true }
dirs = { workspace = true }
encoding_rs = "0.8"
percent-encoding = "2.3"
arboard = "3.7"
png = "0.18"
hmac = { workspace = true }
sha1 = "0.11"
sha2 = { workspace = true }
url = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tauri = { version = "2.12", features = ["test", "tray-icon", "image-png"] }
tempfile = "3"
serialport = { version = "4.7", default-features = false }
