name: build-tauri

# Builds the Tauri 2 + Rust desktop app (rust/apps/netcatty-desktop) for
# macOS, Windows and Linux.
#
#  - Push to the rust-rewrite branch -> build every platform and keep the
#    bundles as workflow artifacts. No release is published.
#  - Push of a release tag -> build and publish a GitHub Release with the
#    bundles. Release tags are plain v<MAJOR>.<MINOR>.<PATCH> (v1.2.3): no
#    suffixes such as -rc.1 or -loch.3. Other tags are ignored.
#  - Manual workflow_dispatch -> build the selected ref. `publish_release`
#    only publishes when the selected ref is also a strict version tag.
#
# The Electron workflow (build.yml) no longer reacts to tag pushes on this
# branch, so the two never upload into the same release.
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish GitHub Release after build (ref must be a v* tag)"
        type: boolean
        default: false
  push:
    branches:
      - claude/rust-rewrite-2f0f0a
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: build-tauri-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  # Exact release-tag rule (also rejects leading zeros such as v01.2.3,
  # which the push filter lets through). MSI additionally caps the version
  # at 255.255.65535.
  STRICT_VERSION_REF_RE: '^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
  TAURI_CLI_VERSION: "2.12.4"
  APP_DIR: rust/apps/netcatty-desktop
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - name: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm
    env:
      # Cloud sync client ids, read at build time by the renderer (Vite) and,
      # for the GitHub client id fallback, by the Rust backend (option_env!).
      VITE_SYNC_GITHUB_CLIENT_ID: ${{ secrets.VITE_SYNC_GITHUB_CLIENT_ID }}
      VITE_SYNC_GOOGLE_CLIENT_ID: ${{ secrets.VITE_SYNC_GOOGLE_CLIENT_ID }}
      VITE_SYNC_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_SYNC_GOOGLE_CLIENT_SECRET }}
      VITE_SYNC_ONEDRIVE_CLIENT_ID: ${{ secrets.VITE_SYNC_ONEDRIVE_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        shell: bash
        run: |
          # rust/rust-toolchain.toml pins the stable channel; install it with
          # the target this job builds for.
          rustup toolchain install stable --profile minimal --target "${{ matrix.target }}"
          rustup target add "${{ matrix.target }}" --toolchain stable
          rustc --version

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: tauri-${{ matrix.target }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: |
            tauri-${{ matrix.target }}-

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config file patchelf xdg-utils libxdo-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libdbus-1-dev

      - name: Install NASM (aws-lc-sys on Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install renderer dependencies
        shell: bash
        run: |
          # Skip lifecycle scripts: postinstall rebuilds Electron native
          # modules, which the Tauri build does not ship. Apply only the
          # patches the renderer bundle depends on.
          npm ci --ignore-scripts
          npx patch-package --error-on-fail
          node scripts/patch-xterm-macos-column-selection.cjs
          node scripts/patch-xterm-foreground-intense.cjs
          node scripts/patch-xterm-image-tile-stride.cjs
          node scripts/patch-xterm-image-iip-type.cjs
          node scripts/patch-xterm-webgl-atlas.cjs

      - name: Write CI Tauri config
        shell: bash
        run: |
          # Tag builds take the version from the tag; other builds keep the
          # version in tauri.conf.json. macOS bundles are ad-hoc signed so
          # Apple Silicon reports an unidentified developer instead of a
          # "damaged" app.
          version=""
          if [[ "$GITHUB_REF" =~ $STRICT_VERSION_REF_RE ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          VERSION="$version" node -e '
            const fs = require("node:fs");
            const conf = { bundle: { macOS: { signingIdentity: "-" } } };
            if (process.env.VERSION) conf.version = process.env.VERSION;
            fs.writeFileSync(process.argv[1], JSON.stringify(conf, null, 2));
            console.log(JSON.stringify(conf));
          ' "$APP_DIR/tauri.ci.conf.json"

      - name: Build Tauri app
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          npx --yes "@tauri-apps/cli@${TAURI_CLI_VERSION}" build \
            --ci \
            --target "${{ matrix.target }}" \
            --bundles "${{ matrix.bundles }}" \
            --config tauri.ci.conf.json

      - name: Collect bundles
        shell: bash
        run: |
          bundle_dir="rust/target/${{ matrix.target }}/release/bundle"
          mkdir -p out
          find "$bundle_dir" -maxdepth 2 -type f \( \
            -name '*.dmg' -o -name '*-setup.exe' -o -name '*.msi' -o -name '*.deb' -o \
            -name '*.rpm' -o -name '*.AppImage' \) -exec cp -v {} out/ \;
          if [[ -z "$(ls -A out)" ]]; then
            echo "::error::No bundles found under $bundle_dir"
            find "$bundle_dir" -maxdepth 3 || true
            exit 1
          fi
          ls -la out

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: netcatty-tauri-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: release
    runs-on: ubuntu-latest
    needs: build
    if: |
      startsWith(github.ref, 'refs/tags/v')
      && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release))
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF" =~ $STRICT_VERSION_REF_RE ]]; then
            echo "::error::Release tags must be exactly v<MAJOR>.<MINOR>.<PATCH>, e.g. v1.2.3."
            exit 1
          fi

      - name: Download bundles
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: netcatty-tauri-*
          merge-multiple: true

      - name: List bundles
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
