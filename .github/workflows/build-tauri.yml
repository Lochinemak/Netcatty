name: build-tauri

# Builds the Tauri 2 + Rust desktop app (rust/apps/netcatty-desktop) for
# macOS, Windows and Linux.
#
#  - Push to main -> build every platform and keep the
#    bundles as workflow artifacts. No release is published.
#  - Push of a release tag -> build and publish a GitHub Release with the
#    bundles. Release tags are plain v<MAJOR>.<MINOR>.<PATCH> (v1.2.3): no
#    suffixes such as -rc.1 or -loch.3. Other tags are ignored.
#  - Manual workflow_dispatch -> build the selected ref. `publish_release`
#    only publishes when the selected ref is also a strict version tag.
#
# The Electron workflow (build.yml) no longer reacts to tag pushes on this
# branch, so the two never upload into the same release.
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish GitHub Release after build (ref must be a v* tag)"
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: build-tauri-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  # Exact release-tag rule (also rejects leading zeros such as v01.2.3,
  # which the push filter lets through). MSI additionally caps the version
  # at 255.255.65535.
  STRICT_VERSION_REF_RE: '^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
  TAURI_CLI_VERSION: "2.12.4"
  APP_DIR: rust/apps/netcatty-desktop
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `targets` is space-separated; each one is built in turn. Both
          # macOS architectures share one runner: macOS runners are the
          # scarce ones, and a second queued macOS job was twice cancelled
          # before it got a machine.
          #
          # The Intel image rather than `macos-latest`: on the arm64 pool the
          # v1.2.4 job was cancelled three times in a row, each after exactly
          # 15 minutes with an empty `runner_name` and no steps — it never got
          # a machine, while the same run's Linux and Windows jobs started in
          # seconds. `macos-15-intel` is the last published x86_64 image
          # (supported to ~Aug 2027) and far fewer jobs target it;
          # `macos-13` is retired and now queues forever. Either way one
          # architecture is cross-compiled, so only the host swaps.
          - name: macos
            os: macos-15-intel
            targets: aarch64-apple-darwin x86_64-apple-darwin
            bundles: app,dmg
          - name: windows-x64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: linux-x64
            os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - name: linux-arm64
            os: ubuntu-22.04-arm
            targets: aarch64-unknown-linux-gnu
            bundles: deb,rpm
    env:
      # Cloud sync client ids, read at build time by the renderer (Vite) and,
      # for the GitHub client id fallback, by the Rust backend (option_env!).
      VITE_SYNC_GITHUB_CLIENT_ID: ${{ secrets.VITE_SYNC_GITHUB_CLIENT_ID }}
      VITE_SYNC_GOOGLE_CLIENT_ID: ${{ secrets.VITE_SYNC_GOOGLE_CLIENT_ID }}
      VITE_SYNC_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_SYNC_GOOGLE_CLIENT_SECRET }}
      VITE_SYNC_ONEDRIVE_CLIENT_ID: ${{ secrets.VITE_SYNC_ONEDRIVE_CLIENT_ID }}
      # Updater signing key (`tauri signer generate`, see rust/README.md).
      # With it the bundler also writes the updater artifacts (.app.tar.gz
      # on macOS, the installers' .sig files); without it they are skipped
      # and the app reports updates as "download manually".
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Public key matching the secret, when it differs from the one in
      # tauri.conf.json (forks). Optional repository variable.
      TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY || '' }}
      # macOS code signing certificate: a base64 .p12 (secret), its password
      # (secret) and the certificate's common name (variable). A stable
      # certificate keeps the app's code identity the same across releases,
      # so a Keychain "Always Allow" survives updates; ad-hoc signatures
      # change with every build. The certificate may be self-signed: it is
      # not trusted by Gatekeeper, which treats it like ad-hoc. Without all
      # three the build falls back to ad-hoc signing. Deliberately not named
      # APPLE_CERTIFICATE: the bundler resolves the identity itself when it
      # sees that variable and only accepts Apple-issued certificates.
      MACOS_SIGN_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      MACOS_SIGN_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        shell: bash
        run: |
          # rust/rust-toolchain.toml pins the stable channel; install it with
          # the targets this job builds for.
          targets=(${{ matrix.targets }})
          rustup toolchain install stable --profile minimal "${targets[@]/#/--target=}"
          rustup target add "${targets[@]}" --toolchain stable
          rustc --version

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          # The image is part of the key: `rust/target` holds build scripts and
          # proc macros compiled for the host, so an arm64-host cache must not
          # be restored onto the Intel macOS image.
          key: tauri-${{ matrix.name }}-${{ matrix.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: |
            tauri-${{ matrix.name }}-${{ matrix.os }}-

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config file patchelf xdg-utils libxdo-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libdbus-1-dev

      - name: Install NASM (aws-lc-sys on Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install renderer dependencies
        shell: bash
        run: |
          # Skip lifecycle scripts: postinstall rebuilds Electron native
          # modules, which the Tauri build does not ship. Apply only the
          # patches the renderer bundle depends on.
          npm ci --ignore-scripts
          npx patch-package --error-on-fail
          node scripts/patch-xterm-macos-column-selection.cjs
          node scripts/patch-xterm-foreground-intense.cjs
          node scripts/patch-xterm-image-tile-stride.cjs
          node scripts/patch-xterm-image-iip-type.cjs
          node scripts/patch-xterm-webgl-atlas.cjs
          # Terminal autocomplete specs, bundled as <resource_dir>/figspecs.
          node rust/scripts/stage-figspecs.cjs

      - name: Fetch bundled mosh-client and et
        # Same MoshCatty / et releases the Electron build bundles. Best
        # effort: without them the app uses mosh-client / et from PATH.
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MOSH_BIN_RELEASE: ${{ vars.MOSH_BIN_RELEASE || '' }}
          ET_BIN_RELEASE: ${{ vars.ET_BIN_RELEASE || '' }}
          # Upstream's binary repo, also when this workflow runs in a fork.
          ET_BIN_OWNER: binaricat
        run: |
          # The macOS entry lists both architectures; its clients are universal.
          case "${{ matrix.targets }}" in
            *-apple-darwin) platform=darwin; arch=universal ;;
            x86_64-pc-windows-msvc) platform=win32; arch=x64 ;;
            x86_64-unknown-linux-gnu) platform=linux; arch=x64 ;;
            aarch64-unknown-linux-gnu) platform=linux; arch=arm64 ;;
            *) echo "no bundled clients for ${{ matrix.targets }}"; exit 0 ;;
          esac
          node scripts/fetch-mosh-binaries.cjs --platform="$platform" --arch="$arch" --resolve-release \
            || echo "::warning::bundled mosh-client unavailable for $platform-$arch"
          node scripts/fetch-et-binaries.cjs --platform="$platform" --arch="$arch" --resolve-release \
            || echo "::warning::bundled et unavailable for $platform-$arch"

      - name: Write CI Tauri config
        shell: bash
        run: |
          # Tag builds take the version from the tag; other builds take the
          # newest released vX.Y.Z tag (so the About page and update check
          # match the latest release), falling back to tauri.conf.json.
          # macOS bundles are signed with the configured certificate (see
          # MACOS_SIGN_*), or ad-hoc without one, so Apple Silicon reports an
          # unidentified developer instead of a "damaged" app. Fetched mosh-client / et binaries are bundled as
          # resources (<resource_dir>/mosh/, <resource_dir>/et/), the layout
          # the backend looks up first.
          #
          # Updater: the endpoint points at this repository's latest release
          # (the release job writes latest.json there), the public key can be
          # overridden per repository, and updater artifacts are only
          # requested when the signing key is available (the bundler fails
          # when asked to sign without one).
          version=""
          if [[ "$GITHUB_REF" =~ $STRICT_VERSION_REF_RE ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(git ls-remote --tags --refs origin 'v*' \
              | sed 's#.*refs/tags/v##' \
              | grep -E '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
              | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1 || true)"
          fi
          echo "bundle version: ${version:-<tauri.conf.json>}"
          case "${{ matrix.targets }}" in
            *-apple-darwin) client_dir=darwin-universal; exe="" ;;
            x86_64-pc-windows-msvc) client_dir=win32-x64; exe=".exe" ;;
            x86_64-unknown-linux-gnu) client_dir=linux-x64; exe="" ;;
            aarch64-unknown-linux-gnu) client_dir=linux-arm64; exe="" ;;
            *) client_dir=""; exe="" ;;
          esac
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; updater artifacts are skipped and this build cannot auto-update"
          fi
          macos_identity="-"
          if [[ "${{ matrix.targets }}" == *-apple-darwin* ]]; then
            if [[ -n "$MACOS_SIGN_CERTIFICATE" && -n "$MACOS_SIGN_CERTIFICATE_PASSWORD" && -n "$MACOS_SIGN_IDENTITY" ]]; then
              macos_identity="$MACOS_SIGN_IDENTITY"
              echo "macOS signing identity: $macos_identity"
            else
              echo "::warning::APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD or APPLE_SIGNING_IDENTITY is not set; macOS bundles are ad-hoc signed and Keychain access is asked again after every update"
            fi
          fi
          VERSION="$version" CLIENT_DIR="$client_dir" EXE="$exe" REPOSITORY="$GITHUB_REPOSITORY" MACOS_IDENTITY="$macos_identity" node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const conf = { bundle: { macOS: { signingIdentity: process.env.MACOS_IDENTITY } } };
            if (process.env.VERSION) conf.version = process.env.VERSION;
            conf.bundle.createUpdaterArtifacts = Boolean(process.env.TAURI_SIGNING_PRIVATE_KEY);
            conf.plugins = { updater: {
              endpoints: [`https://github.com/${process.env.REPOSITORY}/releases/latest/download/latest.json`],
            } };
            if (process.env.TAURI_UPDATER_PUBKEY) conf.plugins.updater.pubkey = process.env.TAURI_UPDATER_PUBKEY;
            const resources = {};
            const dir = process.env.CLIENT_DIR;
            const exe = process.env.EXE;
            if (dir) {
              for (const [tool, name] of [["mosh", "mosh-client"], ["et", "et"]]) {
                const file = path.posix.join("resources", tool, dir, name + exe);
                if (fs.existsSync(file)) resources[`../../../${file}`] = `${tool}/${name}${exe}`;
              }
              const dlls = path.posix.join("resources", "et", dir, `et-${dir}-dlls`);
              if (exe && fs.existsSync(dlls)) resources[`../../../${dlls}/`] = `et/et-${dir}-dlls/`;
            }
            if (fs.existsSync("resources/figspecs")) resources["../../../resources/figspecs/"] = "figspecs/";
            if (Object.keys(resources).length > 0) conf.bundle.resources = resources;
            fs.writeFileSync(process.argv[1], JSON.stringify(conf, null, 2));
            console.log(JSON.stringify(conf));
          ' "$APP_DIR/tauri.ci.conf.json"

      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.MACOS_SIGN_CERTIFICATE != '' && env.MACOS_SIGN_CERTIFICATE_PASSWORD != '' && env.MACOS_SIGN_IDENTITY != ''
        shell: bash
        run: |
          # The certificate is imported here rather than handed to the
          # bundler as APPLE_CERTIFICATE: with that variable set the bundler
          # resolves the identity itself through `security find-certificate`,
          # which only matches certificates whose common name carries one of
          # Apple's prefixes ("Developer ID Application:" and the like) and
          # that hold a team id, so a self-signed one is rejected with
          # "failed to resolve signing identity". With only
          # APPLE_SIGNING_IDENTITY set, the bundler runs `codesign -s` against
          # the user's keychain search list, which is what this step prepares.
          keychain="$RUNNER_TEMP/netcatty-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          cert="$RUNNER_TEMP/netcatty-signing.p12"
          printf '%s' "$MACOS_SIGN_CERTIFICATE" | base64 -d > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          # No auto-lock: a locked keychain fails the build mid-way.
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$MACOS_SIGN_CERTIFICATE_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign
          rm -f "$cert"
          # Lets codesign use the private key without a prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          # codesign looks in the search list, so append this keychain to it,
          # keeping the rest and never listing it twice.
          # shellcheck disable=SC2046
          security list-keychains -d user -s \
            $(security list-keychains -d user | tr -d '"' | grep -v netcatty-signing) "$keychain"
          # An untrusted certificate is listed but reported as not trusted,
          # which codesign accepts; -v would leave it out.
          if ! security find-identity -p codesigning "$keychain" | grep -qF "$MACOS_SIGN_IDENTITY"; then
            echo "::error::no code signing identity \"$MACOS_SIGN_IDENTITY\" in the imported certificate"
            security find-identity -p codesigning "$keychain"
            exit 1
          fi
          echo "imported \"$MACOS_SIGN_IDENTITY\""

      - name: Build Tauri app
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          # The renderer (beforeBuildCommand) is the same for every target:
          # build it with the first one and drop the hook for the rest.
          skip_renderer=()
          # rust/target comes back from the cache with the installers of an
          # earlier build (another version) still under release/bundle;
          # Collect bundles would pick them up next to this build's.
          for target in ${{ matrix.targets }}; do
            rm -rf "$GITHUB_WORKSPACE/rust/target/$target/release/bundle"
          done
          # Only the identity: the certificate is already in the keychain
          # search list (see "Import macOS signing certificate"), and setting
          # APPLE_CERTIFICATE would send the bundler down a path that cannot
          # resolve a self-signed certificate.
          if [[ "${{ runner.os }}" == macOS && -n "$MACOS_SIGN_CERTIFICATE" && -n "$MACOS_SIGN_CERTIFICATE_PASSWORD" && -n "$MACOS_SIGN_IDENTITY" ]]; then
            export APPLE_SIGNING_IDENTITY="$MACOS_SIGN_IDENTITY"
          fi
          for target in ${{ matrix.targets }}; do
            echo "::group::tauri build $target"
            npx --yes "@tauri-apps/cli@${TAURI_CLI_VERSION}" build \
              --ci \
              --target "$target" \
              --bundles "${{ matrix.bundles }}" \
              --config tauri.ci.conf.json \
              "${skip_renderer[@]}"
            echo "::endgroup::"
            skip_renderer=(--config '{"build":{"beforeBuildCommand":null}}')
          done

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p out
          # Installers plus the updater artifacts next to them: each
          # installer's minisign `.sig`, and on macOS the `.app.tar.gz` the
          # updater downloads (renamed per architecture, the bundler names
          # it after the app only). Nothing is signed without the key.
          for target in ${{ matrix.targets }}; do
            bundle_dir="rust/target/$target/release/bundle"
            find "$bundle_dir" -maxdepth 2 -type f \( \
              -name '*.dmg' -o -name '*-setup.exe' -o -name '*.msi' -o -name '*.deb' -o \
              -name '*.rpm' -o -name '*.AppImage' -o -name '*-setup.exe.sig' -o -name '*.msi.sig' -o \
              -name '*.deb.sig' -o -name '*.rpm.sig' -o -name '*.AppImage.sig' \) -exec cp -v {} out/ \;
            case "$target" in
              aarch64-apple-darwin) mac_arch=aarch64 ;;
              x86_64-apple-darwin) mac_arch=x86_64 ;;
              *) mac_arch="" ;;
            esac
            if [[ -n "$mac_arch" ]]; then
              for archive in "$bundle_dir"/macos/*.app.tar.gz; do
                [[ -f "$archive" ]] || continue
                cp -v "$archive" "out/Netcatty_${mac_arch}.app.tar.gz"
                if [[ -f "$archive.sig" ]]; then
                  cp -v "$archive.sig" "out/Netcatty_${mac_arch}.app.tar.gz.sig"
                fi
              done
              # Each architecture must contribute its own DMG.
              if ! compgen -G "$bundle_dir/dmg/*.dmg" >/dev/null; then
                echo "::error::No DMG for $target under $bundle_dir"
                exit 1
              fi
              # With a certificate the code identity must name it (not a
              # per-build cdhash), or the Keychain grant breaks on update.
              if [[ -n "$MACOS_SIGN_CERTIFICATE" && -n "$MACOS_SIGN_CERTIFICATE_PASSWORD" && -n "$MACOS_SIGN_IDENTITY" ]]; then
                for app in "$bundle_dir"/macos/*.app; do
                  requirement="$(codesign -d -r- "$app" 2>&1)"
                  echo "$app: $requirement"
                  if [[ "$requirement" != *"certificate root"* ]]; then
                    echo "::error::$app is not signed with the configured certificate"
                    exit 1
                  fi
                done
              fi
            fi
          done
          if [[ -z "$(ls -A out)" ]]; then
            echo "::error::No bundles found for ${{ matrix.targets }}"
            find rust/target -maxdepth 3 -path '*/release/bundle' || true
            exit 1
          fi
          ls -la out

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: netcatty-tauri-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/netcatty-signing.keychain-db"
          rm -f "$RUNNER_TEMP/netcatty-signing.p12"
          [[ -f "$keychain" ]] || exit 0
          # Takes it out of the search list as well.
          security delete-keychain "$keychain" || true

  release:
    name: release
    runs-on: ubuntu-latest
    needs: build
    if: |
      startsWith(github.ref, 'refs/tags/v')
      && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release))
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF" =~ $STRICT_VERSION_REF_RE ]]; then
            echo "::error::Release tags must be exactly v<MAJOR>.<MINOR>.<PATCH>, e.g. v1.2.3."
            exit 1
          fi

      - name: Download bundles
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: netcatty-tauri-*
          merge-multiple: true

      - name: List bundles
        run: ls -la artifacts/

      - name: Write updater manifest
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # latest.json for tauri-plugin-updater (the endpoint configured in
          # tauri.conf.json): one entry per platform key the updater looks
          # up — {os}-{arch}[-{bundle}] — with the installer's download URL
          # and the contents of its .sig file. Platforms whose artifact was
          # not signed are left out; with no signed artifact at all no
          # manifest is written and installed apps offer manual download.
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const dir = "artifacts";
            const files = fs.readdirSync(dir);
            const repo = process.env.REPOSITORY;
            const tag = process.env.TAG;
            const version = tag.replace(/^v/, "");
            // Installers carry their version in the file name. One from
            // another version (left over from a cached build) must not be
            // published or end up in the manifest.
            const stale = files.filter((name) => {
              const found = name.match(/\d+\.\d+\.\d+/);
              return found && found[0] !== version;
            });
            if (stale.length > 0) {
              console.log(`::error::bundles from another version than ${version}: ${stale.join(", ")}`);
              process.exit(1);
            }
            const targets = [
              ["darwin-aarch64", /^Netcatty_aarch64\.app\.tar\.gz$/],
              ["darwin-x86_64", /^Netcatty_x86_64\.app\.tar\.gz$/],
              ["windows-x86_64", /_x64-setup\.exe$/],
              ["windows-x86_64-nsis", /_x64-setup\.exe$/],
              ["windows-x86_64-msi", /_x64.*\.msi$/],
              ["linux-x86_64", /_amd64\.AppImage$/],
              ["linux-x86_64-appimage", /_amd64\.AppImage$/],
              ["linux-x86_64-deb", /_amd64\.deb$/],
              ["linux-x86_64-rpm", /\.x86_64\.rpm$/],
              ["linux-aarch64-deb", /_arm64\.deb$/],
              ["linux-aarch64-rpm", /\.aarch64\.rpm$/],
            ];
            const platforms = {};
            for (const [key, pattern] of targets) {
              const file = files.find((name) => pattern.test(name));
              if (!file) { console.log(`${key}: no artifact`); continue; }
              const sig = path.join(dir, `${file}.sig`);
              if (!fs.existsSync(sig)) { console.log(`${key}: ${file} is not signed, skipped`); continue; }
              platforms[key] = {
                url: `https://github.com/${repo}/releases/download/${tag}/${file}`,
                signature: fs.readFileSync(sig, "utf8").trim(),
              };
            }
            if (Object.keys(platforms).length === 0) {
              console.log("::warning::no signed updater artifacts; latest.json not written");
              process.exit(0);
            }
            const manifest = {
              version,
              notes: `Netcatty ${tag}: https://github.com/${repo}/releases/tag/${tag}`,
              pub_date: new Date().toISOString(),
              platforms,
            };
            fs.writeFileSync(path.join(dir, "latest.json"), JSON.stringify(manifest, null, 2) + "\n");
            console.log(JSON.stringify(manifest, null, 2));
          '

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
