name: test-electron

# The Electron backend (electron/) is the behavioural reference for the
# Tauri app, not the product, so its runtime tests run only when Electron
# inputs change (or on demand). Renderer, lint, unit and Rust tests run on
# every change in test.yml.
on:
  pull_request:
    paths:
      - "electron/**"
      - "scripts/fido-windows.live.test.cjs"
      - "scripts/fixtures/fido/**"
      - "scripts/terminal-broadcast-ssh.live.cjs"
      - "package.json"
      - "package-lock.json"
      - "patches/**"
      - ".github/workflows/test-electron.yml"
  push:
    branches:
      - main
    paths:
      - "electron/**"
      - "scripts/fido-windows.live.test.cjs"
      - "scripts/fixtures/fido/**"
      - "scripts/terminal-broadcast-ssh.live.cjs"
      - "package.json"
      - "package-lock.json"
      - "patches/**"
      - ".github/workflows/test-electron.yml"
  workflow_dispatch:

concurrency:
  group: test-electron-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  electron-runtime:
    name: electron-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install xvfb
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install deps
        run: npm ci

      - name: Test SSH cipher negotiation in Electron's crypto runtime
        env:
          NETCATTY_SSH_TEST_RUNTIME: electron
        run: node --test electron/bridges/sshChaChaTransport.test.cjs

      - name: Test browser first-link lifecycle
        run: xvfb-run -a ./node_modules/.bin/electron --no-sandbox electron/hostBrowser/hostBrowser.firstLink.live.test.cjs

  windows-fido:
    name: windows-fido
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci --ignore-scripts

      - name: Exercise serial named pipe transport on Windows
        run: node --test electron/bridges/serialNamedPipe.test.cjs

      - name: Apply production dependency patches
        run: npx patch-package --error-on-fail

      - name: Install user-mode OpenSSH and software authenticator toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: gcc openssl-devel openssh

      - name: Build disposable software authenticator
        shell: msys2 {0}
        run: |
          gcc -shared -DHAVE_STDINT_H scripts/fixtures/fido/provider.c -lcrypto -o /usr/lib/netcatty-fido-test-provider.dll
          printf 'NETCATTY_WINDOWS_SSH_AGENT=%s\n' "$(cygpath -w /usr/bin/ssh-agent.exe)" >> "$GITHUB_ENV"
          printf 'NETCATTY_WINDOWS_SSH_KEYGEN=%s\n' "$(cygpath -w /usr/bin/ssh-keygen.exe)" >> "$GITHUB_ENV"
          cygpath -w /usr/bin >> "$GITHUB_PATH"
          ssh -V

      - name: Exercise Windows pipes, PIN bridge, SK signatures and cancellation
        env:
          NETCATTY_FIDO_WINDOWS: "1"
        run: node --test scripts/fido-windows.live.test.cjs electron/bridges/fidoNativeAgent.test.cjs electron/bridges/fidoAskpass.winpath.test.cjs

  windows-broadcast-ssh:
    name: windows-broadcast-ssh
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test SSH cipher negotiation in Windows Electron's crypto runtime
        env:
          NETCATTY_SSH_TEST_RUNTIME: electron
        run: node --test electron/bridges/sshChaChaTransport.test.cjs

      - name: Exercise two SSH password prompts in the desktop app
        run: node scripts/terminal-broadcast-ssh.live.cjs
